server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tenantforge}
    username: ${SPRING_DATASOURCE_USERNAME:tenantforge}
    password: ${SPRING_DATASOURCE_PASSWORD:tenantforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the DDL. Validation can't run at startup because tenant
      # tables live in per-tenant schemas, not wherever the pool starts.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/public
    schemas: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8180/realms/tenantforge}

app:
  stripe:
    api-key: ${APP_STRIPE_API_KEY:}
    webhook-secret: ${APP_STRIPE_WEBHOOK_SECRET:}
    price-pro: ${APP_STRIPE_PRICE_PRO:}
    price-enterprise: ${APP_STRIPE_PRICE_ENTERPRISE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
