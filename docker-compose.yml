services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: saaskit
      POSTGRES_USER: saaskit
      POSTGRES_PASSWORD: saaskit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saaskit -d saaskit"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/saaskit
      KC_DB_USERNAME: saaskit
      KC_DB_PASSWORD: saaskit
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saaskit
      SPRING_DATASOURCE_USERNAME: saaskit
      SPRING_DATASOURCE_PASSWORD: saaskit
      APP_SECURITY_ISSUER_URI: http://keycloak:8080/realms/saaskit
      APP_STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      APP_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      APP_STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
