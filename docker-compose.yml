services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenantkit
      POSTGRES_USER: tenantkit
      POSTGRES_PASSWORD: tenantkit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tenantkit
      KC_DB_USERNAME: tenantkit
      KC_DB_PASSWORD: tenantkit
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      - postgres

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantkit
      SPRING_DATASOURCE_USERNAME: tenantkit
      SPRING_DATASOURCE_PASSWORD: tenantkit
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/tenantkit
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keycloak

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
